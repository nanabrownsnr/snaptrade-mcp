[project]
name = "snaptrade-mcp"
version = "0.1.0"
description = "Read-only brokerage holdings MCP powered by SnapTrade"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.5",
    "snaptrade-python-sdk>=11.0.0,<12",
    "cryptography>=43,<50",
    "psycopg[binary]>=3.2,<4",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
